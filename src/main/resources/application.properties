# =============================================
# Healthcare Management System - Configuration
# =============================================

# Server Configuration
server.port=8080

# Application Name
spring.application.name=Healthcare Management System

# =============================================
# Database Configuration (MySQL)
# =============================================
spring.datasource.url=jdbc:mysql://localhost:3306/healthcare_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=Nam#090404
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =============================================
# JPA / Hibernate Configuration
# =============================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# =============================================
# Thymeleaf Configuration
# =============================================
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.encoding=UTF-8

# =============================================
# Spring Security Configuration
# =============================================
# Default in-memory user (override with UserDetailsService later)
spring.security.user.name=admin
spring.security.user.password=admin123

# =============================================
# Logging Configuration
# =============================================
logging.level.com.healthcare=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG
